format = """
[](fg:@base02@)\
[  $directory](bg:@base02@ fg:@base05@)\
[](fg:@base02@ bg:@base03@)\
[$git_branch$git_status](bg:@base03@ fg:@base05@)\
[](fg:@base03@)
$character"""

[directory]
style = "bg:@base02@ fg:@base05@"
truncation_length = 4
truncate_to_repo = true
truncation_symbol = "…/"

[git_branch]
symbol = " "
format = "[ $symbol$branch ]($style)"
style = "bg:@base03@ fg:@base05@"

[git_status]
format = "[$all_status$ahead_behind ]($style)"
style = "bg:@base03@ fg:@base08@"
conflicted = "="
ahead = "⇡$count"
behind = "⇣$count"
diverged = "⇕⇡$count⇣$count"
untracked = "?"
stashed = "$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[character]
success_symbol = "[❯](bold @base0D@)"
error_symbol = "[❯](bold @base08@)"
vicmd_symbol = "[❮](bold @base0E@)"

[cmd_duration]
min_time = 2000
format = "[took $duration ](fg:#8f9099)"
