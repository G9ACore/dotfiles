# Палитра — та же, что в waybar/colors.css
add_newline = false
command_timeout = 1000

format = """
$directory\
$git_branch\
$git_status\
$cmd_duration\
$character"""

[directory]
truncation_length = 4
truncate_to_repo = true
truncation_symbol = "…/"
format = "[](fg:#2e4578)[ $path ](bg:#2e4578 fg:#e2e2e9 bold)[](fg:#2e4578) "

[git_branch]
symbol = " "
format = "[](fg:#404659)[ $symbol$branch ](bg:#404659 fg:#c0c6dc)[](fg:#404659) "

[git_status]
format = "[](fg:#404659)[ $all_status$ahead_behind ](bg:#404659 fg:#ffb4ab)[](fg:#404659) "

[cmd_duration]
min_time = 2000
format = "[](fg:#282a2f)[  $duration ](bg:#282a2f fg:#8f9099)[](fg:#282a2f) "

[character]
success_symbol = "[❯](bold #b0c6ff)"
error_symbol = "[❯](bold #ffb4ab)"
vicmd_symbol = "[❮](bold #e0bbde)"
